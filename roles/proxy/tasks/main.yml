---

- name: Assert that all required inputs have been provided.
  ansible.builtin.assert:
    that:
      - tesseract_domain is not none
      - proxy_services is not none
      - proxy_xcaddy_version is not none
      - proxy_go_version is not none

- name: Set architecture to amd64.
  ansible.builtin.set_fact:
    download_arch: "amd64"
  when: ansible_facts['architecture'] == "x86_64"

- name: Set architecture to arm64.
  ansible.builtin.set_fact:
    download_arch: "arm64"
  when: '"armv" in ansible_facts["architecture"] or "aarch" in ansible_facts["architecture"]'

- name: Check for sysctl.conf.
  ansible.builtin.stat:
    path: /etc/sysctl.conf
  register: proxy_sysctl_conf

- name: Increase maximum socket receive buffer.
  when: proxy_sysctl_conf.stat.exists
  notify: reload sysctl
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    search_string: 'net.core.rmem_max'
    line: 'net.core.rmem_max=2500000'
    owner: root
    group: root
    mode: '0644'

- name: Configure Go.
  ansible.builtin.include_tasks:
    file: go.yml

- name: Configure Caddy.
  ansible.builtin.include_tasks:
    file: caddy.yml
