---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Check isc-dhcp-server service is running.
      ansible.builtin.systemd:
        name: isc-dhcp-server
      register: dhcp_service
      failed_when: dhcp_service.status.ActiveState != 'active'

    - name: Check dhcpd.conf exists.
      ansible.builtin.stat:
        path: /etc/dhcp/dhcpd.conf
      register: dhcpd_conf
      failed_when: not dhcpd_conf.stat.exists

    - name: Validate dhcpd.conf syntax.
      ansible.builtin.command: dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false
