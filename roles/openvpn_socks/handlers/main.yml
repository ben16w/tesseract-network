---

- name: Restart OpenVPN client.  # noqa: command-instead-of-module
  listen: restart openvpn socks
  ansible.builtin.command:
    cmd: systemctl restart --no-block openvpn-client@openvpn-socks
  changed_when: true

- name: Reload systemd for Dante unit.
  listen: restart dante
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Dante SOCKS proxy.  # noqa: command-instead-of-module
  listen: restart dante
  ansible.builtin.command:
    cmd: systemctl restart --no-block danted
  changed_when: true
