---

- name: Check for systemd-resolved.conf.
  ansible.builtin.stat:
    path: /etc/systemd/resolved.conf
  register: blocky_resolved_conf

- name: Ensure systemd-resolved.conf is set correctly
  when: blocky_resolved_conf.stat.exists
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?DNS=', line: 'DNS=1.1.1.1' }
    - { regexp: '^#?DNSStubListener=', line: 'DNSStubListener=no' }
  notify: restart systemd-resolved
